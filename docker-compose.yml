services:
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Local-only defaults so `docker compose up` works. Override via .env; never reuse in production.
      AUTH_USERNAME: ${AUTH_USERNAME:-demo}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-demo-password}
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-only-secret-0123456789abcdef}
    ports: ["8077:8000"] # direct API access (8000 is often taken on dev machines)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  # Production-like: built static frontend behind nginx, /api proxied to the api service.
  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  # Dev: Vite with hot reload.  docker compose --profile dev up web-dev
  web-dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY: http://api:8000
    volumes:
      - ./frontend:/app
      - web_dev_node_modules:/app/node_modules # keep container-built deps off the host
    ports: ["${DEV_PORT:-5173}:5173"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  web_dev_node_modules:
