[project]
name = "windwatch-backend"
version = "0.1.0"
description = "Day-ahead wind forecast decision support API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pandas>=2.2,<3",
  "pydantic-settings>=2.6,<3",
  "tzdata>=2024.2",
]

[project.optional-dependencies]
ingest = ["httpx>=0.27,<1", "tenacity>=9,<10"]
serve = ["uvicorn[standard]>=0.32,<1"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "respx>=0.21", "ruff>=0.7", "mypy>=1.13", "pandas-stubs", "httpx>=0.27", "tenacity>=9", "uvicorn>=0.32"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]  # line length is owned by the formatter

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
